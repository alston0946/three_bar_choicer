name: daily-selection

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1-5"

concurrency:
  group: daily-selection
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TZ: Asia/Shanghai
      PYTHONUTF8: "1"
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      QQ_SMTP_SENDER: ${{ secrets.QQ_SMTP_SENDER }}
      QQ_SMTP_AUTH_CODE: ${{ secrets.QQ_SMTP_AUTH_CODE }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      EMAIL_SUBJECT_PREFIX: ${{ secrets.EMAIL_SUBJECT_PREFIX }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily selection
        run: python run_daily_selection.py --output-dir artifacts

      - name: Send summary email
        run: |
          python send_email.py \
            --summary-json artifacts/mail_summary.json \
            --attachments artifacts/three_bar_selection_candidates.csv

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: three-bar-daily-selection
          path: |
            artifacts/three_bar_selection_candidates.csv
            artifacts/mail_summary.json
          if-no-files-found: warn
          retention-days: 7
